<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FutureSOC AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-page">

        <header class="landing-header">
            <h2>FutureSOC AI</h2>

            <nav class="landing-nav">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </nav>
        </header>

        <div class="auth-logo">
            <h1>FutureSOC AI</h1>
            <p>Agentic Security Operations and Incident Intelligence Platform</p>
        </div>

        <div class="form-box">
            <h1>Login</h1>
            <p>Access your SOC investigation dashboard.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="admin@example.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary full-btn">
                    Login
                </button>
            </form>

            <div class="auth-link">
                Don't have an organization?
                <a href="register.html">Create one</a>
            </div>
        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>

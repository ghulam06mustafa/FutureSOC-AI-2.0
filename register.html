<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FutureSOC AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-page">

        <header class="landing-header">
            <h2>FutureSOC AI</h2>

            <nav class="landing-nav">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </nav>
        </header>

        <div class="auth-logo">
            <h1>FutureSOC AI</h1>
            <p>Create your organization and first admin account</p>
        </div>

        <div class="form-box">
            <h1>Create Organization</h1>
            <p>Register your company, university, or SOC team.</p>

            <form id="registerForm">
                <div class="form-group">
                    <label>Organization Name</label>
                    <input type="text" id="organization_name" placeholder="Example: ABC Security Team" required>
                </div>

                <div class="form-group">
                    <label>Admin Full Name</label>
                    <input type="text" id="full_name" placeholder="Enter admin name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="admin@example.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Minimum 8 characters" required>
                </div>

                <button type="submit" class="btn btn-primary full-btn">
                    Create Account
                </button>
            </form>

            <div class="auth-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>
        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
